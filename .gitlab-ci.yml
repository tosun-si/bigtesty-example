variables:
  GOOGLE_CLOUD_PROJECT: "gb-poc-373711"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: "copy"

stages:
  - tests

tests:
  stage: tests
  image: "ghcr.io/astral-sh/uv:python3.13-bookworm-slim"
  when: manual
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  script:
    - uv sync --frozen
    - uv run bigtesty test
  after_script:
    - uv cache prune --ci
